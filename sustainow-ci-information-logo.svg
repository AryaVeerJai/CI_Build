<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sustainow Carbon Intelligence logo">
  <defs>
    <linearGradient id="sciPetalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4F4B8"/>
      <stop offset="45%" stop-color="#8FE06A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="sciPetalDeep" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0D3D12"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="sciIntelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B8E2E"/>
      <stop offset="100%" stop-color="#43C94A"/>
    </linearGradient>
    <filter id="sciWatercolor" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <g filter="url(#sciWatercolor)" transform="translate(512 340)">
    <ellipse cx="-248" cy="-12" rx="178" ry="76" transform="rotate(-22)" fill="url(#sciPetalLight)" fill-opacity="0.78"/>
    <ellipse cx="-148" cy="-38" rx="178" ry="76" transform="rotate(-11)" fill="url(#sciPetalLight)" fill-opacity="0.82"/>
    <ellipse cx="-68" cy="-54" rx="178" ry="76" transform="rotate(-3)" fill="url(#sciPetalLight)" fill-opacity="0.84"/>
    <ellipse cx="0" cy="-68" rx="178" ry="76" fill="url(#sciPetalLight)" fill-opacity="0.88"/>
    <ellipse cx="68" cy="-54" rx="178" ry="76" transform="rotate(3)" fill="url(#sciPetalLight)" fill-opacity="0.84"/>
    <ellipse cx="148" cy="-38" rx="178" ry="76" transform="rotate(11)" fill="url(#sciPetalLight)" fill-opacity="0.82"/>
    <ellipse cx="248" cy="-12" rx="178" ry="76" transform="rotate(22)" fill="url(#sciPetalLight)" fill-opacity="0.78"/>

    <ellipse cx="-188" cy="10" rx="158" ry="70" transform="rotate(-16)" fill="#7FD054" fill-opacity="0.62"/>
    <ellipse cx="-118" cy="-2" rx="158" ry="70" transform="rotate(-8)" fill="#72C942" fill-opacity="0.64"/>
    <ellipse cx="-44" cy="-14" rx="158" ry="70" transform="rotate(-2)" fill="#6BC137" fill-opacity="0.66"/>
    <ellipse cx="0" cy="-26" rx="158" ry="70" fill="#5FAF30" fill-opacity="0.68"/>
    <ellipse cx="44" cy="-14" rx="158" ry="70" transform="rotate(2)" fill="#6BC137" fill-opacity="0.66"/>
    <ellipse cx="118" cy="-2" rx="158" ry="70" transform="rotate(8)" fill="#72C942" fill-opacity="0.64"/>
    <ellipse cx="188" cy="10" rx="158" ry="70" transform="rotate(16)" fill="#7FD054" fill-opacity="0.62"/>

    <ellipse cx="-92" cy="30" rx="132" ry="60" transform="rotate(-6)" fill="url(#sciPetalDeep)" fill-opacity="0.48"/>
    <ellipse cx="0" cy="30" rx="132" ry="60" fill="url(#sciPetalDeep)" fill-opacity="0.52"/>
    <ellipse cx="92" cy="30" rx="132" ry="60" transform="rotate(6)" fill="url(#sciPetalDeep)" fill-opacity="0.48"/>
  </g>

  <g transform="translate(512 578)">
    <text text-anchor="middle" y="0" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="80" font-weight="650" letter-spacing="-0.02em">
      <tspan fill="#3568BF">sust</tspan><tspan fill="#3568BF">1</tspan><tspan fill="#3568BF">now</tspan>
    </text>
    <circle cx="-6" cy="-52" r="9" fill="#57D84A" aria-hidden="true"/>
  </g>

  <text x="512" y="698" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="124" font-weight="800" fill="#22A02E">Carbon</text>
  <text x="512" y="818" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="124" font-weight="800" fill="url(#sciIntelGreen)">Intelligence</text>
</svg>
