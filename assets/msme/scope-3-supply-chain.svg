<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-label="Scope 3 emissions from supply chain and transport">
  <defs>
    <linearGradient id="s3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <marker id="s3arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="480" height="280" rx="16" fill="url(#s3sky)"/>
  <ellipse cx="240" cy="248" rx="190" ry="18" fill="#1e293b" opacity="0.1"/>

  <!-- Path / road -->
  <path d="M40 200 H440" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M40 200 H440" stroke="#fff" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>

  <!-- Supplier warehouse -->
  <rect x="36" y="118" width="88" height="72" rx="8" fill="#fff" stroke="#475569" stroke-width="2.5"/>
  <path d="M36 126 L80 92 L124 126 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <rect x="56" y="148" width="48" height="28" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <rect x="68" y="162" width="24" height="28" rx="2" fill="#94a3b8"/>

  <!-- Arrow: supplier → materials -->
  <path d="M132 154 H168" stroke="#475569" stroke-width="3" marker-end="url(#s3arrow)"/>

  <!-- Material crates / inventory -->
  <rect x="172" y="128" width="56" height="44" rx="4" fill="#64748b" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="186" y="148" width="56" height="44" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <rect x="200" y="168" width="56" height="36" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

  <!-- Arrow: materials → transport -->
  <path d="M264 168 H298" stroke="#475569" stroke-width="3" marker-end="url(#s3arrow)"/>

  <!-- Delivery truck -->
  <rect x="304" y="148" width="100" height="42" rx="8" fill="#fff" stroke="#334155" stroke-width="2.5"/>
  <path d="M404 168 H436 V190 H404 Z" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
  <rect x="412" y="174" width="18" height="12" rx="2" fill="#e2e8f0"/>
  <circle cx="328" cy="198" r="13" fill="#1e293b"/>
  <circle cx="328" cy="198" r="5" fill="#cbd5e1"/>
  <circle cx="388" cy="198" r="13" fill="#1e293b"/>
  <circle cx="388" cy="198" r="5" fill="#cbd5e1"/>
  <circle cx="424" cy="198" r="11" fill="#1e293b"/>
  <circle cx="424" cy="198" r="4" fill="#cbd5e1"/>

  <!-- Value-chain globe / network -->
  <circle cx="240" cy="64" r="34" fill="#fff" stroke="#475569" stroke-width="2.5"/>
  <ellipse cx="240" cy="64" rx="16" ry="34" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M206 64 H274 M212 48 H268 M212 80 H268" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M228 40 C248 52 248 76 228 88" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <circle cx="222" cy="56" r="4" fill="#475569"/>
  <circle cx="256" cy="70" r="4" fill="#475569"/>
  <circle cx="240" cy="48" r="3.5" fill="#64748b"/>

  <!-- Waste / recycle hint -->
  <circle cx="440" cy="86" r="22" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <path d="M432 78 C436 72 448 74 446 84 C444 92 434 92 432 86" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M438 90 L432 86 L438 80" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
