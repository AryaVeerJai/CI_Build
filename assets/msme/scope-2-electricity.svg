<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-label="Scope 2 emissions from purchased electricity">
  <defs>
    <linearGradient id="s2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="s2bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="s2glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="280" rx="16" fill="url(#s2sky)"/>
  <ellipse cx="240" cy="248" rx="190" ry="18" fill="#1e3a8a" opacity="0.1"/>

  <!-- Transmission tower -->
  <line x1="72" y1="48" x2="72" y2="220" stroke="#1e40af" stroke-width="5" stroke-linecap="round"/>
  <line x1="48" y1="78" x2="96" y2="78" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="118" x2="104" y2="118" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="158" x2="96" y2="158" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M56 48 C56 28 88 28 88 48" stroke="#1e40af" stroke-width="3.5" fill="none"/>
  <path d="M72 78 L52 118 L72 158 L92 118 Z" stroke="#93c5fd" stroke-width="2" fill="none"/>

  <!-- Power lines to building -->
  <path d="M96 78 C140 70 180 90 210 118" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-dasharray="8 5"/>
  <path d="M104 118 C150 110 190 130 220 150" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Facility / workshop -->
  <rect x="210" y="128" width="140" height="92" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M224 196 L280 148 L336 196 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
  <rect x="258" y="196" width="44" height="24" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="228" y="156" width="28" height="24" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="304" y="156" width="28" height="24" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Meter / bill panel -->
  <rect x="368" y="148" width="72" height="72" rx="10" fill="#fff" stroke="#1e40af" stroke-width="2.5"/>
  <rect x="380" y="160" width="48" height="28" rx="4" fill="#dbeafe"/>
  <text x="404" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">kWh</text>
  <line x1="384" y1="200" x2="424" y2="200" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <line x1="384" y1="208" x2="412" y2="208" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>

  <!-- Lightning / energy glow -->
  <circle cx="280" cy="78" r="48" fill="url(#s2glow)"/>
  <path d="M292 42 L262 88 H284 L272 122 L312 72 H290 Z" fill="url(#s2bolt)" stroke="#1e40af" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
