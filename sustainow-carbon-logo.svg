  <text x="512" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="800" fill="#1E8B24">Carbon</text>
  <text x="512" y="820" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="800" fill="url(#textGreen)">Intelligence</text>
