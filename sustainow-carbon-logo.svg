    <ellipse cx="-150" cy="-40" rx="175" ry="75" transform="rotate(-10)" fill="url(#petalLight)" fill-opacity="0.82"/>
    <ellipse cx="-70" cy="-55" rx="175" ry="75" transform="rotate(-2)" fill="url(#petalLight)" fill-opacity="0.82"/>
    <ellipse cx="0" cy="-70" rx="175" ry="75" fill="url(#petalLight)" fill-opacity="0.85"/>
    <ellipse cx="70" cy="-55" rx="175" ry="75" transform="rotate(2)" fill="url(#petalLight)" fill-opacity="0.82"/>
    <ellipse cx="150" cy="-40" rx="175" ry="75" transform="rotate(10)" fill="url(#petalLight)" fill-opacity="0.82"/>
    <ellipse cx="250" cy="-15" rx="175" ry="75" transform="rotate(20)" fill="url(#petalLight)" fill-opacity="0.80"/>

    <ellipse cx="-190" cy="8" rx="155" ry="68" transform="rotate(-15)" fill="#76C83D" fill-opacity="0.72"/>
    <ellipse cx="-120" cy="-5" rx="155" ry="68" transform="rotate(-8)" fill="#72C63A" fill-opacity="0.72"/>
    <ellipse cx="-45" cy="-15" rx="155" ry="68" transform="rotate(-2)" fill="#6FC338" fill-opacity="0.74"/>
    <ellipse cx="0" cy="-28" rx="155" ry="68" fill="#6BC137" fill-opacity="0.75"/>
    <ellipse cx="45" cy="-15" rx="155" ry="68" transform="rotate(2)" fill="#6FC338" fill-opacity="0.74"/>
