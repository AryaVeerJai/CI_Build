<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sustainow Carbon Intelligence logo">
  <defs>
    <linearGradient id="petalLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8E7A8"/>
      <stop offset="100%" stop-color="#5FB533"/>
    </linearGradient>
    <linearGradient id="petalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F9F31"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="textGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F8D24"/>
      <stop offset="100%" stop-color="#41C62A"/>
