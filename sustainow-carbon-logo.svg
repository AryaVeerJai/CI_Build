    <ellipse cx="0" cy="28" rx="130" ry="58" fill="url(#petalDark)" fill-opacity="0.54"/>
    <ellipse cx="90" cy="28" rx="130" ry="58" transform="rotate(6)" fill="url(#petalDark)" fill-opacity="0.52"/>
