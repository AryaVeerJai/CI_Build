  <text x="512" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700">
    <tspan fill="#2855A6">sust</tspan><tspan fill="#39A726">a</tspan><tspan fill="#2855A6">inow</tspan>
