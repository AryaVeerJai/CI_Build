<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sustainow leaf mark">
  <defs>
    <linearGradient id="dmPetalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8F0A8"/>
      <stop offset="55%" stop-color="#7FD456"/>
      <stop offset="100%" stop-color="#3D8C2E"/>
    </linearGradient>
    <linearGradient id="dmPetalDeep" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
    <filter id="dmWatercolor" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="#FFFFFF"/>
