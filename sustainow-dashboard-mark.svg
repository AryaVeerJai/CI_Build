    <ellipse cx="-36" cy="-10" rx="52" ry="22" transform="rotate(-18)" fill="url(#dmPetalLight)" fill-opacity="0.82"/>
    <ellipse cx="-12" cy="-18" rx="52" ry="22" transform="rotate(-6)" fill="url(#dmPetalLight)" fill-opacity="0.84"/>
    <ellipse cx="0" cy="-22" rx="52" ry="22" fill="url(#dmPetalLight)" fill-opacity="0.88"/>
    <ellipse cx="12" cy="-18" rx="52" ry="22" transform="rotate(6)" fill="url(#dmPetalLight)" fill-opacity="0.84"/>
    <ellipse cx="36" cy="-10" rx="52" ry="22" transform="rotate(18)" fill="url(#dmPetalLight)" fill-opacity="0.82"/>
    <ellipse cx="62" cy="4" rx="52" ry="22" transform="rotate(38)" fill="url(#dmPetalLight)" fill-opacity="0.78"/>
    <ellipse cx="-34" cy="14" rx="44" ry="20" transform="rotate(-22)" fill="#6FCF3A" fill-opacity="0.55"/>
    <ellipse cx="0" cy="8" rx="44" ry="20" fill="url(#dmPetalDeep)" fill-opacity="0.45"/>
    <ellipse cx="34" cy="14" rx="44" ry="20" transform="rotate(22)" fill="#6FCF3A" fill-opacity="0.55"/>
